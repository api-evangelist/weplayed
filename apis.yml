description: WePlayed builds AI-powered short-form video for college athletics, automatically
  turning full game and event footage into shareable highlight clips that athletic departments,
  sponsors, and fans use to engage audiences and power sponsorship deals. A Techstars Sports
  Accelerator company that raised a $2 million seed round, WePlayed partners with SIDEARM Sports
  to distribute highlights across collegiate athletics websites. As of this profile WePlayed does
  not publish a public developer API, SDK, or API documentation surface.
